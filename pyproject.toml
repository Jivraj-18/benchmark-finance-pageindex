[project]
name = "finbench"
version = "0.1.0"
description = "Cost vs accuracy of PageIndex and other retrieval methods on FinanceBench, across the latest LLMs"
requires-python = ">=3.11"
dependencies = [
    "pageindex==0.2.20",
    "openai>=1.70",
    "pypdfium2>=5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finbench"]
