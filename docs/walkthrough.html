<script>
const { meta, questions } = JSON.parse(document.getElementById("data").textContent);
const LABELS = { "pageindex": "PageIndex", "vector-rag": "Vector RAG", "full-context": "Whole filing", "agentic-search": "Agentic search" };
const SHAPES = { "pageindex": "circle", "vector-rag": "square", "full-context": "diamond", "agentic-search": "triangle" };
const ICONS = { correct: "✓", incorrect: "✗", refusal: "–", error: "!" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const fmtCost = c => c >= 0.01 ? "$" + c.toFixed(3) : "$" + c.toFixed(4);
const fmtN = n => n == null ? "" : n.toLocaleString();

function shapePath(shape, r) {
  if (shape === "square") { const s = r * 0.9; return `M${-s},${-s}H${s}V${s}H${-s}Z`; }
  if (shape === "diamond") { const s = r * 1.25; return `M0,${-s}L${s},0L0,${s}L${-s},0Z`; }
  if (shape === "triangle") { const s = r * 1.3; return `M0,${-s}L${s * 0.95},${s * 0.7}L${-s * 0.95},${s * 0.7}Z`; }
  return `M${-r},0A${r},${r} 0 1,0 ${r},0A${r},${r} 0 1,0 ${-r},0Z`;
}
const keySvg = m => `<svg width="14" height="14" viewBox="-7 -7 14 14" aria-hidden="true"><path d="${shapePath(SHAPES[m], 5)}" fill="var(--${m})"/></svg>`;
const badge = v => `<span class="badge ${v}">${ICONS[v] || "?"} ${v}</span>`;

document.getElementById("repo-link").href = meta.repo;
document.getElementById("subtitle").textContent =
  `The same question answered by each method with the same model setting (${meta.config}). ` +
  `Every step is recorded from the actual run: the model's thinking (the summary its provider returns), each tool call and what came back, any failed calls, tokens read and time taken.`;
document.getElementById("footer").innerHTML =
  `Recorded with <code>uv run python -m finbench.walkthrough --ids … --config ${meta.config}</code>; ` +
  `long prompts and tool results are cut for display. Graded by ${meta.judge}. ` +
  `<a href="${meta.repo}">Code and data</a>.`;

function step(s) {
  const meta = [];
  if (s.tokens) meta.push(`model read ${fmtN(s.tokens)} tokens`);
  if (s.thought) meta.push(`thought for ${fmtN(s.thought)} tokens`);
  if (s.seconds != null) meta.push(`${s.seconds}s`);
  const body = s.kind === "tool" ? `<code>${esc(s.body)}</code>` : (s.kind === "answer" ? md(s.body) : esc(s.body));
  return `<li class="${s.kind}"><div class="step-title">${esc(s.title)}</div>` +
    (meta.length ? `<div class="step-meta">${meta.join(" · ")}</div>` : "") +
    (s.thinking ? `<div class="thinking"><span class="thinking-label">Thinking</span>${md(s.thinking)}</div>` : "") +
    (s.body ? `<div class="step-body">${body}</div>` : "") +
    (s.detail ? `<details><summary>${s.kind === "tool" ? "Show what came back" : "Show"}</summary><pre>${esc(s.detail)}</pre></details>` : "") +
    `</li>`;
}

function show(i) {
  const q = questions[i];
  document.querySelectorAll("#tabs button").forEach((b, j) => b.setAttribute("aria-selected", j === i));
  document.getElementById("question").innerHTML =
    `<div class="small muted">${esc(q.id)} · ${esc(q.doc)}</div><h2>${esc(q.question)}</h2>` +
    `<div class="gold"><b>Gold answer</b> (FinanceBench's reference answer): ${esc(q.gold)}</div>`;
  document.getElementById("methods").innerHTML = q.methods.map(m => `
    <section class="card method" style="--accent: var(--${m.method})">
      <header>
        <h3>${keySvg(m.method)}${LABELS[m.method]}</h3>
        ${badge(m.verdict)}
        <div class="stats">
          <span>Model calls</span><b>${m.calls}</b>
          <span>Tokens read</span><b>${fmtN(m.input_tokens)}</b>
          <span>Cost</span><b>${fmtCost(m.cost)}</b>
          <span>Time</span><b>${m.seconds}s</b>
        </div>
      </header>
      <ol class="steps">${m.steps.map(step).join("")}</ol>
      ${m.reason ? `<div class="verdict-reason"><b>Grader:</b> ${esc(m.reason)}</div>` : ""}
    </section>`).join("");
  history.replaceState(null, "", "#" + q.id);
}

const tabs = document.getElementById("tabs");
tabs.innerHTML = questions.map((q, i) => `<button role="tab" data-i="${i}">${esc(q.question.length > 60 ? q.question.slice(0, 57) + "…" : q.question)}</button>`).join("");
tabs.addEventListener("click", e => { const b = e.target.closest("button"); if (b) show(+b.dataset.i); });
if (questions.length < 2) tabs.hidden = true;
const start = Math.max(0, questions.findIndex(q => "#" + q.id === location.hash));
if (questions.length) show(start);
</script>
