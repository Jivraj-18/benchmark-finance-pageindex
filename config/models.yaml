# Models and reasoning-effort settings used in the benchmark.
#
# All calls go through LLM Foundry's OpenRouter-compatible route:
#   $LLMFOUNDRY_BASE_URL/openrouter/v1
# Prices are USD per million tokens, copied from
#   $LLMFOUNDRY_BASE_URL/openrouter/v1/models   on 2026-09-30.
#
# A run config is written `model@effort`, e.g. `gpt-6-luna@xhigh`.
# `default` means no reasoning parameter is sent (the model's own default).
#
# Reasoning levels, verified by probing on 2026-09-30:
#   OpenAI GPT-6.x   none, minimal, low, medium, high, xhigh   ("none" = no thinking)
#   Claude 5.x       minimal, low, medium, high, xhigh          ("none" is rejected)
#   Gemini 3.x       minimal, low, medium, high, xhigh          ("none" is rejected)
#   Claude Haiku 4.5 no effort setting -> default only
#
# To add a model: add it under `models`, then list its efforts under `grid`.

models:
  # OpenAI: Luna (small) < Sol (mid-high) < Astra (flagship). "-pro" = same weights, pro reasoning mode.
  gpt-6-luna:          {id: openai/gpt-6-luna,           family: openai,    input: 0.10,  output: 0.50,  cache_read: 0.01}
  gpt-6-luna-pro:      {id: openai/gpt-6-luna-pro,       family: openai,    input: 0.10,  output: 0.50,  cache_read: 0.01}
  gpt-6.1-sol:         {id: openai/gpt-6.1-sol,          family: openai,    input: 2.00,  output: 10.00, cache_read: 0.10}
  gpt-6-astra:         {id: openai/gpt-6-astra,          family: openai,    input: 10.00, output: 50.00, cache_read: 1.00}

  # Anthropic: Haiku (small, older) < Sonnet < Opus < Fable (flagship)
  claude-haiku-4.5:    {id: anthropic/claude-haiku-4.5,  family: anthropic, input: 1.00,  output: 5.00,  cache_read: 0.10}
  claude-sonnet-5.5:   {id: anthropic/claude-sonnet-5.5, family: anthropic, input: 2.00,  output: 10.00, cache_read: 0.20}
  claude-opus-5.5:     {id: anthropic/claude-opus-5.5,   family: anthropic, input: 4.00,  output: 20.00, cache_read: 0.20}
  claude-fable-5.1:    {id: anthropic/claude-fable-5.1,  family: anthropic, input: 10.00, output: 50.00, cache_read: 0.25}

  # Google: Flash-Lite < Flash < Pro. No Gemini Pro newer than 3.1 is available.
  gemini-3.1-flash-lite: {id: google/gemini-3.1-flash-lite, family: google, input: 0.25, output: 1.50,  cache_read: 0.025}
  gemini-3.5-flash-lite: {id: google/gemini-3.5-flash-lite, family: google, input: 0.30, output: 2.50,  cache_read: 0.03}
  gemini-3.8-flash:      {id: google/gemini-3.8-flash,      family: google, input: 0.75, output: 3.75,  cache_read: 0.075}
  gemini-3.1-pro:        {id: google/gemini-3.1-pro-preview, family: google, input: 2.00, output: 12.00, cache_read: 0.20}

# Settings run by `--configs all`: cheap GPT and Gemini models, each with little vs.
# a lot of thinking. Claude models are defined above but not run for now. Move to
# pricier models (gpt-6.1-sol, gemini-3.1-pro, Claude, then gpt-6-astra) only if the
# results call for it: add them here.
grid:
  gpt-6-luna:            [none, high]
  gemini-3.5-flash-lite: [low]
  gemini-3.8-flash:      [low, high]

# Builds PageIndex trees (once per document). PageIndex recommends a cheap model here.
index_model: gpt-6-luna@low

# Grades every answer. Held fixed so all runs are graded the same way.
judge_model: claude-sonnet-5.5@medium

# Embeds filing chunks and questions for the vector-rag method, via $LLMFOUNDRY_BASE_URL/openai/v1.
embedding_model: {id: text-embedding-3-large, input: 0.13}
